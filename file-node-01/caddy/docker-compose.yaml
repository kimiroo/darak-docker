name: caddy

services:
  caddy:
    container_name: caddy
    image: ghcr.io/kimiroo/caddy-cf:latest
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./config:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    secrets:
      - cf_api_token
      - gts_eab_key_id
      - gts_eab_hmac_key
    environment:
      - ACME_EMAIL=${ACME_EMAIL:?set ACME_EMAIL in .env}
    networks:
      - caddy-bridge
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  caddy_data:
  caddy_config:

secrets:
  cf_api_token:
    file: ${SECRETS_DIR:-${HOME}/.secrets}/cf_api_token
  gts_eab_key_id:
    file: ${SECRETS_DIR:-${HOME}/.secrets}/gts_eab_key_id
  gts_eab_hmac_key:
    file: ${SECRETS_DIR:-${HOME}/.secrets}/gts_eab_hmac_key

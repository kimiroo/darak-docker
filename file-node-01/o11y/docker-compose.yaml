name: o11y

services:
  victoria-metrics:
    container_name: victoria-metrics
    image: quay.io/victoriametrics/victoria-metrics:latest
    restart: unless-stopped
    volumes:
      - /mnt/o11y/metrics:/data
    command:
      - "-storageDataPath=/data"
      - "-retentionPeriod=1y"
    networks:
      - o11y
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  victoria-logs:
    container_name: victoria-logs
    image: quay.io/victoriametrics/victoria-logs:latest
    restart: unless-stopped
    volumes:
      - /mnt/o11y/logs:/data
    command:
      - "-storageDataPath=/data"
      - "-retentionPeriod=30d"
      - "-retention.maxDiskUsagePercent=90"
    networks:
      - o11y
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  caddy-proxy:
    container_name: caddy-proxy
    image: ghcr.io/kimiroo/caddy-cf:latest
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./caddy:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    secrets:
      - cf_api_token
      - gts_eab_key_id
      - gts_eab_hmac_key
    environment:
      - ACME_EMAIL=${ACME_EMAIL:?set ACME_EMAIL in .env}
    networks:
      - o11y
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: nickfedor/watchtower
    container_name: watchtower
    restart: always
    environment:
      - TZ=Asia/Seoul
      - WATCHTOWER_SCHEDULE=0 0 3 * * *
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_REMOVE_VOLUMES=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_NOTIFICATION_URL=/run/secrets/watchtower_notification_url
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    secrets:
      - watchtower_notification_url
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  caddy_data:
  caddy_config:

networks:
  o11y:

secrets:
  cf_api_token:
    file: /home/yongj/.secrets/cf_api_token
  gts_eab_key_id:
    file: /home/yongj/.secrets/gts_eab_key_id
  gts_eab_hmac_key:
    file: /home/yongj/.secrets/gts_eab_hmac_key
  watchtower_notification_url:
    file: /home/yongj/.secrets/watchtower_notification_url
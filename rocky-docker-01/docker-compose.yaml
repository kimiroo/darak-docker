name: root

include:
  - ./caddy/docker-compose.yaml
  - ./watchtower/docker-compose.yaml

networks:
  caddy-bridge:
    name: caddy-bridge
    driver: bridge
    # The gateway is referenced by extra_hosts in caddy/docker-compose.yaml;
    # keep the two in sync.
    ipam:
      config:
        - subnet: 172.31.0.0/24
          gateway: 172.31.0.1
